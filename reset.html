<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>重置管理员密码</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

            background: #f5f7fb;

            color: #1f2937;
        }

        .box {

            width: 100%;

            max-width: 400px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 10px 35px rgba(0,0,0,.06);
        }

        h1 {

            margin: 0;

            text-align: center;

            font-size: 24px;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin:
                10px 0 25px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            outline: none;

            margin-bottom: 16px;

            font-size: 16px;
        }

        input:focus {

            border-color: #2563eb;
        }

        button {

            width: 100%;

            height: 46px;

            border: 0;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            opacity: .9;
        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        #message {

            min-height: 24px;

            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            color: #374151;
        }

        .success {

            color: #16a34a !important;
        }

        .error {

            color: #dc2626 !important;
        }

        .hidden {

            display: none;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>
        🔐 重置管理员密码
    </h1>

    <div class="subtitle">
        魔术手卡密查询系统
    </div>


    <div id="formBox">

        <label>
            新密码
        </label>

        <input
            id="newPassword"
            type="password"
            placeholder="请输入新密码"
        >


        <label>
            确认新密码
        </label>

        <input
            id="confirmPassword"
            type="password"
            placeholder="再次输入新密码"
        >


        <button
            id="resetButton"
            onclick="resetPassword()"
        >
            修改密码
        </button>

    </div>


    <div id="message">
        正在验证重置链接...
    </div>

</div>


<script>


// ==================================================
// Supabase
// ==================================================

const SUPABASE_URL =
    "https://dmdnnbjbjhjedzodmlft.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YOcRrmDG4qJMMF90QW4p2Q_0HH_CA-D";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==================================================
// 消息
// ==================================================

function showMessage(
    text,
    type = ""
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        type;
}


// ==================================================
// 密码恢复事件
// ==================================================

supabase.auth.onAuthStateChange(

    async (event, session) => {

        console.log(
            "Auth event:",
            event
        );


        if (
            event ===
            "PASSWORD_RECOVERY"
        ) {

            document
                .getElementById(
                    "formBox"
                )
                .classList
                .remove("hidden");


            showMessage(
                "请输入新的管理员密码"
            );

            return;
        }


        if (session) {

            document
                .getElementById(
                    "formBox"
                )
                .classList
                .remove("hidden");

            showMessage(
                "请输入新的管理员密码"
            );

        }

    }

);


// ==================================================
// 页面启动
// ==================================================

async function init() {

    try {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            console.error(error);

            showMessage(
                "重置链接无效，请重新发送密码重置邮件",
                "error"
            );

            return;
        }


        if (data.session) {

            document
                .getElementById(
                    "formBox"
                )
                .classList
                .remove("hidden");


            showMessage(
                "请输入新的管理员密码"
            );

            return;
        }


        // 等待 PASSWORD_RECOVERY 事件

        setTimeout(
            async () => {

                const {
                    data
                } =
                    await supabase
                        .auth
                        .getSession();


                if (!data.session) {

                    showMessage(
                        "重置链接无效或已过期，请重新发送重置邮件",
                        "error"
                    );

                }

            },
            3000
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "验证重置链接失败",
            "error"
        );

    }

}


// ==================================================
// 修改密码
// ==================================================

async function resetPassword() {

    const newPassword =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmPassword"
            )
            .value;


    if (!newPassword) {

        showMessage(
            "请输入新密码",
            "error"
        );

        return;
    }


    if (newPassword.length < 6) {

        showMessage(
            "新密码至少需要 6 位",
            "error"
        );

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        showMessage(
            "两次输入的密码不一致",
            "error"
        );

        return;
    }


    const button =
        document
            .getElementById(
                "resetButton"
            );


    button.disabled =
        true;


    button.textContent =
        "正在修改...";


    showMessage(
        "正在修改密码..."
    );


    const {
        error
    } =
        await supabase.auth.updateUser({

            password:
                newPassword

        });


    if (error) {

        console.error(error);

        showMessage(
            "修改密码失败：" +
            error.message,
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "修改密码";

        return;
    }


    showMessage(
        "密码修改成功！正在返回登录页面...",
        "success"
    );


    document
        .getElementById(
            "newPassword"
        )
        .value = "";


    document
        .getElementById(
            "confirmPassword"
        )
        .value = "";


    await supabase.auth.signOut();


    setTimeout(
        () => {

            window.location.href =
                "https://moshushou-ios.github.io/card-admin/";

        },
        1500
    );

}


init();

</script>

</body>

</html>
